services:
  # 抽出（data/raw → data/interim → data/extracted）
  tools:
    build: docker/tools
    volumes:
      - .:/work
    working_dir: /work

  # 公開サイト（Astro）。node_modules はホストと混ぜないよう名前付きボリュームに置く。
  # ポートは SITE_PORT で変えられる（中と外を同じ番号にして、Astro が出す URL と合わせる）。
  # --ignore-lock: Astro のロックファイル（site/.astro/dev.json）はコンテナの中のプロセス番号を記録し、止めると残る。
  # 次のコンテナでも同じ番号になるため、自分を動いているサーバーと取り違えて起動を断る。二重起動はポートで防げるので使わない
  site:
    image: node:24-alpine
    volumes:
      - .:/work
      - site_node_modules:/work/site/node_modules
    working_dir: /work/site
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "${SITE_PORT:-4321}:${SITE_PORT:-4321}"
    command: npm run dev -- --host 0.0.0.0 --port ${SITE_PORT:-4321} --ignore-lock

volumes:
  site_node_modules:
