# どのサービスもほかのコンテナとはつながず、外（npm など）とつながるかポートを出すだけなので、
# Docker の既定の bridge に載せる。compose がプロジェクト（main・worktree）ごとにネットワークを作らないように
services:
  # 抽出（data/raw → data/interim → data/extracted）
  tools:
    build: docker/tools
    network_mode: bridge
    volumes:
      - .:/work
    working_dir: /work

  # 公開サイト（Astro）。node_modules はホストと混ぜないよう名前付きボリュームに置く。
  # ポートは SITE_PORT で変えられる（中と外を同じ番号にして、Astro が出す URL と合わせる）。
  # --ignore-lock: Astro のロックファイル（site/.astro/dev.json）はコンテナの中のプロセス番号を記録し、止めると残る。
  # 次のコンテナでも同じ番号になるため、自分を動いているサーバーと取り違えて起動を断る。二重起動はポートで防げるので使わない
  site:
    image: node:24-alpine
    network_mode: bridge
    volumes:
      - .:/work
      - site_node_modules:/work/site/node_modules
    working_dir: /work/site
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      WATCH_POLLING: "1"
    ports:
      - "${SITE_PORT:-4321}:${SITE_PORT:-4321}"
    command: npm run dev -- --host 0.0.0.0 --port ${SITE_PORT:-4321} --ignore-lock

  # 画面の確認（Playwright の Chromium）。scripts/shot/shot.ts が site/dist を中で配信して、PC 幅とスマホ幅の
  # スクリーンショットを tmp/shots に書き出す。node_modules は site と同じく名前付きボリュームに置き、
  # まだ無いか package-lock.json のほうが新しければ（版を上げたあと）先に npm ci してから渡されたコマンドを動かす。
  # init と ipc: host は Playwright の案内どおり（Chromium の共有メモリが足りなくならないように）
  shot:
    build: docker/shot
    network_mode: bridge
    volumes:
      - .:/work
      - shot_node_modules:/work/scripts/shot/node_modules
    working_dir: /work
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    init: true
    ipc: host
    entrypoint:
      - sh
      - -c
      - 'set -e; cd scripts/shot; [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund; cd /work; exec "$$@"'
      - --

volumes:
  site_node_modules:
  shot_node_modules:
