<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- そのままだと日本語に中国語のフォント（WenQuanYi）が選ばれるので、サイトの font の並びにある
     Noto Sans JP と、ゴシックの既定を Noto Sans CJK JP（Android の日本語フォントと同じもの）に向ける -->
<fontconfig>
  <alias binding="same">
    <family>Noto Sans JP</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
</fontconfig>
